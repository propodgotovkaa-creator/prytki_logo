<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Прятки: найди персонажа</title>
</head>
<body>
<script>
const gameConfig = {
  backgroundImage:
    "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=1600&auto=format&fit=crop",

  characters: [
    { id: "cat", name: "Кот", image: "https://cdn-icons-png.flaticon.com/512/616/616430.png" },
    { id: "dog", name: "Пёс", image: "https://cdn-icons-png.flaticon.com/512/616/616408.png" },
    { id: "fox", name: "Лиса", image: "https://cdn-icons-png.flaticon.com/512/616/616417.png" },
    { id: "rabbit", name: "Кролик", image: "https://cdn-icons-png.flaticon.com/512/3069/3069172.png" }
  ],

  totalSuccessRequired: 7,
  charactersPerRound: 4,

  characterSizePercent: 11,
  hitRadiusPercent: 8,

  appearanceTimeMs: 2000,
  delayBetweenCharactersMs: 600,
  delayBeforeQuestionMs: 400,
  delayAfterSuccessMs: 900,

  showVisualFeedback: true,
  language: "ru",

  texts: {
    ru: {
      find: "Найди",
      finalMessage: "Приходи играть в прятки ещё раз!",
      startTitle: "Прятки: найди персонажа",
      startDescription: "Запомни, где появляются персонажи. Потом найди место, где был нужный герой.",
      startButton: "Начать игру",
      restartButton: "Играть снова",
      replayRound: "Повторить раунд"
    }
  }
};

document.body.innerHTML = `
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f3f3;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

#hide-and-seek-game {
  width: 100%;
  max-width: 960px;
  aspect-ratio: 16 / 9;
  position: relative;
  overflow: hidden;
  background: #ddd;
  border-radius: 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,.18);
  user-select: none;
}

.game-background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

.character {
  position: absolute;
  width: var(--character-size);
  height: var(--character-size);
  object-fit: contain;
  transform: translate(-50%, -50%) scale(.8);
  opacity: 0;
  z-index: 3;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}

.character.visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.top-panel {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  pointer-events: none;
}

.left-panel {
  display: flex;
  gap: 12px;
  align-items: center;
}

.right-panel {
  display: flex;
  gap: 12px;
  align-items: center;
  pointer-events: auto;
}

.instruction,
.progress {
  background: rgba(255,255,255,.92);
  border-radius: 16px;
  padding: 10px 16px;
  font-size: 24px;
  font-weight: 700;
  color: #222;
}

.instruction {
  display: none;
  align-items: center;
  gap: 12px;
}

.instruction.visible {
  display: flex;
}

.instruction img {
  width: 54px;
  height: 54px;
  object-fit: contain;
}

.replay-button {
  width: 56px;
  height: 56px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.94);
  color: #222;
  font-size: 32px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,.18);
  display: none;
  justify-content: center;
  align-items: center;
  line-height: 1;
}

.replay-button.visible {
  display: flex;
}

.replay-button:disabled {
  opacity: .45;
  cursor: default;
}

.replay-button:not(:disabled):hover {
  transform: scale(1.06);
}

.feedback {
  position: absolute;
  inset: 0;
  z-index: 7;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
  font-size: 90px;
  opacity: 0;
  transform: scale(.7);
  transition: opacity .2s ease, transform .2s ease;
}

.feedback.visible {
  opacity: 1;
  transform: scale(1);
}

.click-marker {
  position: absolute;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 6;
  pointer-events: none;
  animation: markerPop .5s ease forwards;
}

.click-marker.success {
  border: 5px solid #4caf50;
  background: rgba(76,175,80,.18);
}

.click-marker.error {
  border: 5px solid #e53935;
  background: rgba(229,57,53,.14);
}

@keyframes markerPop {
  from { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.final-screen,
.start-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(255,255,255,.95);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 32px;
}

.final-screen {
  display: none;
  z-index: 10;
}

.final-screen.visible {
  display: flex;
}

.start-overlay.hidden {
  display: none;
}

.final-card,
.start-card {
  background: white;
  padding: 32px;
  border-radius: 24px;
  box-shadow: 0 12px 30px rgba(0,0,0,.18);
  max-width: 560px;
}

button {
  border: 0;
  padding: 14px 28px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  background: #ffcc33;
  color: #222;
}
</style>

<div id="hide-and-seek-game">
  <img class="game-background" id="gameBackground" alt="Фон игры" />
  <div id="charactersLayer"></div>

  <div class="top-panel">
    <div class="left-panel">
      <div class="instruction" id="instruction">
        <span id="instructionText">Найди</span>
        <img id="instructionImage" alt="Искомый персонаж" />
      </div>
    </div>

    <div class="right-panel">
      <div class="progress" id="progress">0 / 7</div>
      <button class="replay-button" id="replayRoundButton" title="Повторить раунд">↻</button>
    </div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="final-screen" id="finalScreen">
    <div class="final-card">
      <h2 id="finalMessage">Приходи играть в прятки ещё раз!</h2>
      <button id="restartButton">Играть снова</button>
    </div>
  </div>

  <div class="start-overlay" id="startOverlay">
    <div class="start-card">
      <h1>Прятки: найди персонажа</h1>
      <p>Запомни, где появляются персонажи. Потом найди место, где был нужный герой.</p>
      <button id="startButton">Начать игру</button>
    </div>
  </div>
</div>
`;

const gameState = {
  successCount: 0,
  roundNumber: 0,
  currentRoundCharacters: [],
  currentPositions: {},
  targetCharacter: null,
  inputEnabled: false,
  sequencePlaying: false,
  finished: false
};

const el = {
  game: document.getElementById("hide-and-seek-game"),
  background: document.getElementById("gameBackground"),
  charactersLayer: document.getElementById("charactersLayer"),
  instruction: document.getElementById("instruction"),
  instructionText: document.getElementById("instructionText"),
  instructionImage: document.getElementById("instructionImage"),
  progress: document.getElementById("progress"),
  feedback: document.getElementById("feedback"),
  finalScreen: document.getElementById("finalScreen"),
  finalMessage: document.getElementById("finalMessage"),
  restartButton: document.getElementById("restartButton"),
  startOverlay: document.getElementById("startOverlay"),
  startButton: document.getElementById("startButton"),
  replayRoundButton: document.getElementById("replayRoundButton")
};

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function t(key) {
  return gameConfig.texts[gameConfig.language][key];
}

function initGame() {
  el.background.src = gameConfig.backgroundImage;
  el.game.style.setProperty("--character-size", `${gameConfig.characterSizePercent}%`);
  updateProgress();

  el.startButton.textContent = t("startButton");
  el.restartButton.textContent = t("restartButton");
  el.replayRoundButton.title = t("replayRound");

  el.startButton.addEventListener("click", () => {
    el.startOverlay.classList.add("hidden");
    restartGame();
  });

  el.restartButton.addEventListener("click", restartGame);
  el.replayRoundButton.addEventListener("click", replayCurrentRound);
  el.game.addEventListener("click", handleGameClick);
}

function restartGame() {
  gameState.successCount = 0;
  gameState.roundNumber = 0;
  gameState.finished = false;
  gameState.inputEnabled = false;
  gameState.sequencePlaying = false;

  el.finalScreen.classList.remove("visible");
  updateProgress();
  startNextRound();
}

async function startNextRound() {
  if (gameState.finished) return;

  gameState.roundNumber++;
  gameState.inputEnabled = false;
  gameState.sequencePlaying = true;

  hideReplayButton();
  clearCharacters();
  clearMarkers();
  hideInstruction();

  generateRound();
  renderRoundCharacters();

  await playCharactersSequence();
  await wait(gameConfig.delayBeforeQuestionMs);

  askQuestion();

  gameState.sequencePlaying = false;
  gameState.inputEnabled = true;
  showReplayButton();
}

async function replayCurrentRound(event) {
  if (event) event.stopPropagation();
  if (gameState.finished || gameState.sequencePlaying) return;

  gameState.inputEnabled = false;
  gameState.sequencePlaying = true;

  hideReplayButton();
  clearMarkers();
  hideInstruction();
  hideAllCharacters();

  await playCharactersSequence();
  await wait(gameConfig.delayBeforeQuestionMs);

  showSameQuestionAgain();

  gameState.sequencePlaying = false;
  gameState.inputEnabled = true;
  showReplayButton();
}

function generateRound() {
  const shuffled = shuffle([...gameConfig.characters]);
  gameState.currentRoundCharacters = shuffled.slice(0, gameConfig.charactersPerRound);
  gameState.currentPositions = {};

  gameState.currentRoundCharacters.forEach(character => {
    gameState.currentPositions[character.id] = {
      x: random(12, 88),
      y: random(24, 84)
    };
  });
}

function renderRoundCharacters() {
  gameState.currentRoundCharacters.forEach(character => {
    const pos = gameState.currentPositions[character.id];
    const img = document.createElement("img");

    img.className = "character";
    img.dataset.characterId = character.id;
    img.src = character.image;
    img.alt = character.name;
    img.style.left = `${pos.x}%`;
    img.style.top = `${pos.y}%`;

    el.charactersLayer.appendChild(img);
  });
}

async function playCharactersSequence() {
  for (const character of gameState.currentRoundCharacters) {
    const characterEl = getCharacter(character.id);
    if (!characterEl) continue;

    characterEl.classList.add("visible");
    await wait(gameConfig.appearanceTimeMs);

    characterEl.classList.remove("visible");
    await wait(gameConfig.delayBetweenCharactersMs);
  }
}

function askQuestion() {
  const index = Math.floor(Math.random() * gameState.currentRoundCharacters.length);
  gameState.targetCharacter = gameState.currentRoundCharacters[index];
  showSameQuestionAgain();
}

function showSameQuestionAgain() {
  el.instructionText.textContent = t("find");
  el.instructionImage.src = gameState.targetCharacter.image;
  el.instructionImage.alt = gameState.targetCharacter.name;
  el.instruction.classList.add("visible");
}

function handleGameClick(event) {
  if (!gameState.inputEnabled || gameState.finished) return;

  const rect = el.game.getBoundingClientRect();
  const x = ((event.clientX - rect.left) / rect.width) * 100;
  const y = ((event.clientY - rect.top) / rect.height) * 100;

  if (isCorrectClick(x, y)) {
    handleSuccess(x, y);
  } else {
    handleError(x, y);
  }
}

function isCorrectClick(x, y) {
  const target = gameState.currentPositions[gameState.targetCharacter.id];
  const dx = x - target.x;
  const dy = y - target.y;

  return Math.sqrt(dx * dx + dy * dy) <= gameConfig.hitRadiusPercent;
}

async function handleSuccess(x, y) {
  gameState.inputEnabled = false;
  hideReplayButton();

  gameState.successCount++;
  updateProgress();

  if (gameConfig.showVisualFeedback) {
    showMarker(x, y, "success");
    showFeedback("🎉");
  }

  if (gameState.successCount >= gameConfig.totalSuccessRequired) {
    await wait(gameConfig.delayAfterSuccessMs);
    finishGame();
  } else {
    await wait(gameConfig.delayAfterSuccessMs);
    startNextRound();
  }
}

function handleError(x, y) {
  if (gameConfig.showVisualFeedback) {
    showMarker(x, y, "error");
    showFeedback("✕");
  }
}

function finishGame() {
  gameState.finished = true;
  gameState.inputEnabled = false;
  gameState.sequencePlaying = false;

  hideReplayButton();
  clearCharacters();
  hideInstruction();

  el.finalMessage.textContent = t("finalMessage");
  el.finalScreen.classList.add("visible");
}

function showFeedback(symbol) {
  el.feedback.textContent = symbol;
  el.feedback.classList.add("visible");

  setTimeout(() => {
    el.feedback.classList.remove("visible");
  }, 450);
}

function showMarker(x, y, type) {
  const marker = document.createElement("div");

  marker.className = `click-marker ${type}`;
  marker.style.left = `${x}%`;
  marker.style.top = `${y}%`;

  el.game.appendChild(marker);

  setTimeout(() => marker.remove(), 700);
}

function updateProgress() {
  el.progress.textContent = `${gameState.successCount} / ${gameConfig.totalSuccessRequired}`;
}

function showReplayButton() {
  el.replayRoundButton.classList.add("visible");
  el.replayRoundButton.disabled = false;
}

function hideReplayButton() {
  el.replayRoundButton.classList.remove("visible");
  el.replayRoundButton.disabled = true;
}

function hideInstruction() {
  el.instruction.classList.remove("visible");
}

function clearCharacters() {
  el.charactersLayer.innerHTML = "";
}

function hideAllCharacters() {
  el.charactersLayer
    .querySelectorAll(".character")
    .forEach(character => character.classList.remove("visible"));
}

function clearMarkers() {
  el.game.querySelectorAll(".click-marker").forEach(marker => marker.remove());
}

function getCharacter(id) {
  return el.charactersLayer.querySelector(`[data-character-id="${id}"]`);
}

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

initGame();
</script>
</body>
</html>
